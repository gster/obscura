[package]
name = "autopilot-browser-runtime"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
obscura-browser = { path = "../crates/obscura-browser", features = ["stealth", "render"] }
obscura-net = { path = "../crates/obscura-net", features = ["stealth"] }
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "net", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"

[dev-dependencies]
obscura-dom = { path = "../crates/obscura-dom" }
obscura-js = { path = "../crates/obscura-js", features = ["render"] }
png = "=0.18.1"

[build-dependencies]
serde_json = "1"
sha2 = "0.10"

[patch.crates-io]
taffy = { path = "../vendor/taffy" }
cosmic-text = { path = "../vendor/cosmic-text" }

[profile.dev]
debug = 0

[profile.release]
panic = "unwind"
strip = "debuginfo"

[workspace]
