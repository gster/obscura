[package]
name = "obscura-net"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Compatibility alias. The primp transport is part of every build and cannot
# be disabled; downstream manifests may remove this feature at their leisure.
stealth = []

[dependencies]
base64 = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
sha2 = "0.10"
chrono-tz = "0.10"
async-trait = "0.1"
encoding_rs = "0.8"
tempfile = "3"
futures-util = "0.3"
bytes = "1"
primp = { version = "=2.0.1", default-features = false, features = ["gzip", "brotli", "deflate", "zstd", "stream"] }
http = "1"
psl = "2"

[dev-dependencies]
socket2 = "0.6"
# TLS fixtures for the configured-roots tests: rcgen mints a throwaway CA + leaf,
# tokio-rustls serves one HTTPS response with them. Pinned to the ring
# provider so TLS fixtures use an explicit, consistent CryptoProvider.
rcgen = "0.13"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
