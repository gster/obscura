[package]
edition = "2021"
rust-version = "1.89"
name = "primp"
version = "2.0.1"
authors = ["deedy5"]
build = false
include = [
    "README.md",
    "Cargo.toml",
    "LICENSE",
    "src/**/*.rs",
    "tests/**/*.rs",
    "examples/**/*.rs",
    "benches/**/*.rs",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "HTTP client with browser impersonation capabilities"
readme = "README.md"
keywords = [
    "http",
    "request",
    "client",
    "impersonate",
]
categories = ["web-programming::http-client"]
license = "MIT"
repository = "https://github.com/deedy5/primp"
resolver = "3"

[package.metadata.docs.rs]
features = ["hickory-dns"]
rustdoc-args = [
    "--cfg",
    "docsrs",
]
targets = ["x86_64-unknown-linux-gnu"]

[features]
brotli = ["tower-http/decompression-br"]
charset = [
    "dep:encoding_rs",
    "dep:mime",
]
cookies = [
    "dep:cookie_crate",
    "dep:cookie_store",
    "dep:psl",
]
default = [
    "cookies",
    "gzip",
    "brotli",
    "zstd",
    "deflate",
    "query",
    "form",
    "json",
    "multipart",
    "stream",
    "system-proxy",
    "charset",
]
deflate = ["tower-http/decompression-deflate"]
form = [
    "dep:serde",
    "dep:serde_urlencoded",
]
gzip = ["tower-http/decompression-gzip"]
hickory-dns = [
    "dep:hickory-resolver",
    "hickory-resolver/https-aws-lc-rs",
    "hickory-resolver/tls-aws-lc-rs",
    "hickory-resolver/webpki-roots",
]
http3 = [
    "dep:h3",
    "dep:h3-quinn",
    "dep:quinn",
    "dep:futures-core",
    "tokio/macros",
]
json = [
    "dep:serde",
    "dep:serde_json",
]
multipart = [
    "dep:mime_guess",
    "dep:futures-util",
    "dep:futures-core",
]
